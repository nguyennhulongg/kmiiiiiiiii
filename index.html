<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💕 Cho Anh Xin Lỗi Nha</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe0f0 0%, #ffc2d4 50%, #ffb3c6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart-float {
      position: absolute;
      bottom: -50px;
      font-size: 1.5rem;
      animation: floatUp linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .bear {
      font-size: 5rem;
      display: block;
      margin-bottom: 8px;
      animation: wobble 2s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #d63384;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e07aaa;
      margin-bottom: 36px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      overflow: hidden;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      border-radius: 50px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }

    #btn-yes {
      background: linear-gradient(135deg, #ff6eb4, #ff1493);
      color: white;
      font-size: 1.1rem;
      padding: 14px 32px;
      max-width: 100%;
      width: fit-content;
    }

    #btn-no {
      background: #f8d7e8;
      color: #c0557a;
      font-size: 1rem;
      padding: 12px 28px;
    }

    /* success screen */
    #success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #success .big-emoji {
      font-size: 5rem;
      animation: pop 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes pop {
      0%   { transform: scale(0); }
      80%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #success h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #d63384;
    }

    #success p {
      font-size: 1rem;
      color: #e07aaa;
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <div class="card">

    <!-- Question screen -->
    <div id="question-screen">
      <span class="bear">🐻</span>
      <h1>Bé tha lỗi cho anh nhé? 🥺</h1>
      <p class="subtitle">Anh xin lỗi thiệt lòng mà... 💗</p>
      <div class="btn-group">
        <button id="btn-yes" onclick="sayYes()">Cóaa 🤍</button>
        <button id="btn-no"  onclick="sayNo()">Khom 🙈</button>
      </div>
    </div>

    <!-- Success screen -->
    <div id="success">
      <span class="big-emoji">🥰</span>
      <h2>Hứa sẽ không làm bé giận nữa đâu 🤍</h2>
      <p>Cảm ơn bé đã tha lỗi cho anh 🥹</p>
    </div>

  </div>

  <script>
    // --- floating hearts ---
    const bg = document.getElementById('heartsBg');
    const emojis = ['💕','💗','💓','💖','🌸','✨','💝'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.className = 'heart-float';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (5 + Math.random() * 8) + 's';
      h.style.animationDelay = (Math.random() * 8) + 's';
      h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
      bg.appendChild(h);
    }

    // --- button logic ---
    let noCount = 0;
    const btnNo  = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');

    const noLabels = [
      'Không 🙈', 'Không nha!', 'Vẫn không!',
      'Hmm không...', 'Không đâu~', 'Cứng đầu ghê!',
      'Nói không nữa nè', 'Thật sự không??'
    ];

    function sayNo() {
      noCount++;

      const noScale  = Math.max(0.15, 1 - noCount * 0.12);
      const yesPad   = Math.min(14 + noCount * 6, 36);
      const yesFsize = Math.min(1.1 + noCount * 0.18, 2.2);

      btnNo.style.transform  = `scale(${noScale})`;
      btnNo.style.opacity    = noScale < 0.3 ? noScale * 2 : '1';
      if (noScale <= 0.15) {
        btnNo.style.pointerEvents = 'none';
        btnNo.style.opacity = '0';
      }

      btnYes.style.padding   = `${yesPad}px ${yesPad * 2.2}px`;
      btnYes.style.fontSize  = `${yesFsize}rem`;

      btnNo.textContent = noLabels[Math.min(noCount, noLabels.length - 1)];
    }

    function sayYes() {
      document.getElementById('question-screen').style.display = 'none';
      const s = document.getElementById('success');
      s.style.display = 'flex';
    }
  </script>
</body>
</html>
